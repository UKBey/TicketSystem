name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: it-service-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure mvnw executable
        run: chmod +x mvnw

      - name: Run unit + integration tests
        run: ./mvnw -B clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: it-service-backend/target/surefire-reports
          if-no-files-found: ignore

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failsafe-reports
          path: it-service-backend/target/failsafe-reports
          if-no-files-found: ignore

  llm-service-build:
    name: LLM Service Build (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build (skip tests — no DB available in CI)
        run: mvn -B clean package -DskipTests

  frontend-quality:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: it-service-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: it-service-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  k8s-manifests:
    name: K8s Manifests (kustomize + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: Provide stub secrets.env for kustomize
        run: cp k8s/overlays/local/secrets.env.example k8s/overlays/local/secrets.env

      - name: Render and validate local overlay
        run: |
          kubectl kustomize k8s/overlays/local --load-restrictor=LoadRestrictionsNone \
            | kubeconform -strict -summary -ignore-missing-schemas
