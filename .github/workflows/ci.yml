name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: it-service-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure mvnw executable
        run: chmod +x mvnw

      - name: Run unit + integration tests
        run: ./mvnw -B clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: it-service-backend/target/surefire-reports
          if-no-files-found: ignore

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failsafe-reports
          path: it-service-backend/target/failsafe-reports
          if-no-files-found: ignore

  frontend-quality:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: it-service-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: it-service-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build-and-push:
    name: Build & Push Docker Images
    needs: [backend-tests, frontend-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./it-service-backend
          push: true
          tags: ghcr.io/ukbey/it-service-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./it-service-frontend
          push: true
          tags: ghcr.io/ukbey/it-service-frontend:latest

      - name: Build and push ldap
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile-ldap
          push: true
          tags: ghcr.io/ukbey/it-service-ldap:latest
