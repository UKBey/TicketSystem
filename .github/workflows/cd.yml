name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy To VDS
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate deploy secrets
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          VDS_SSH_PASSPHRASE: ${{ secrets.VDS_SSH_PASSPHRASE }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          set -e

          if [ -z "$VDS_HOST" ] || [ -z "$VDS_PORT" ] || [ -z "$VDS_USER" ]; then
            echo "One or more VDS connection secrets are empty" >&2
            exit 1
          fi

          if [ -z "$VDS_SSH_PRIVATE_KEY" ]; then
            echo "VDS_SSH_PRIVATE_KEY is empty. Paste the private key content, not the .pub file." >&2
            exit 1
          fi

          tmp_key_file=$(mktemp)
          trap 'rm -f "$tmp_key_file"' EXIT
          printf '%s\n' "$VDS_SSH_PRIVATE_KEY" > "$tmp_key_file"

          if [ -n "$VDS_SSH_PASSPHRASE" ]; then
            if ! ssh-keygen -y -P "$VDS_SSH_PASSPHRASE" -f "$tmp_key_file" >/dev/null 2>&1; then
              echo "VDS_SSH_PRIVATE_KEY could not be parsed with the provided passphrase. Make sure both secrets are correct." >&2
              exit 1
            fi
          elif ! ssh-keygen -y -f "$tmp_key_file" >/dev/null 2>&1; then
            echo "VDS_SSH_PRIVATE_KEY could not be parsed. Make sure it is the full private key from id_ed25519, not the .pub file." >&2
            exit 1
          fi

          if [ -z "$PROD_ENV_FILE" ]; then
            echo "PROD_ENV_FILE is empty" >&2
            exit 1
          fi

      - name: Setup SSH key and agent (supports passphrase)
        env:
          VDS_SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          VDS_SSH_PASSPHRASE: ${{ secrets.VDS_SSH_PASSPHRASE }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          set -e
          echo "Writing private key to disk"
          printf '%s\n' "$VDS_SSH_PRIVATE_KEY" > deploy_key.pem
          chmod 600 deploy_key.pem

          echo "Starting ssh-agent and adding key"
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          sudo apt-get update -qq
          sudo apt-get install -y expect openssh-client

          /usr/bin/expect <<'EXPECT'
          set timeout -1
          spawn ssh-add deploy_key.pem
          expect {
            "Enter passphrase" {
              send "$env(VDS_SSH_PASSPHRASE)\r"
              exp_continue
            }
            eof
          }
          EXPECT

          echo "Testing SSH auth to host (will create target dir)"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i deploy_key.pem -p "$VDS_PORT" "$VDS_USER"@"$VDS_HOST" "mkdir -p /home/$VDS_USER/it-service && chown $VDS_USER:$VDS_USER /home/$VDS_USER/it-service && find /home/$VDS_USER/it-service -maxdepth 1 -type d -name 'Caddyfile' -exec rm -rf {} + || true"

      - name: Copy deployment files to server (scp)
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          set -e
          echo "Copying files to server via scp"
          scp -o StrictHostKeyChecking=no -i deploy_key.pem -P "$VDS_PORT" -r docker-compose.yaml init-db.sql Dockerfile-ldap logstash.conf otel-collector-config.yaml keycloak-init keycloak-themes ldap-init it-service-backend it-service-frontend Caddyfile "$VDS_USER"@"$VDS_HOST":/home/$VDS_USER/it-service

      - name: Run remote deploy commands (ssh)
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          set -e
          ssh_opts='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i deploy_key.pem'
          echo "Writing .env on remote and running docker compose"
          ssh $ssh_opts -p "$VDS_PORT" "$VDS_USER"@"$VDS_HOST" "printf '%s' \"$PROD_ENV_FILE\" > /home/$VDS_USER/it-service/.env && cd /home/$VDS_USER/it-service && docker compose pull || true && docker compose up -d --build --remove-orphans && docker image prune -f"
      