name: CD

# main branch'e merge olan her push'ta tetiklenir.
# CI workflow'u başarıyla tamamlandıktan sonra çalışır —
# test veya lint başarısız olursa CD tetiklenmez.
on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Docker image'larını build edip Docker Hub'a push et
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    # Yalnızca CI başarılı olduğunda çalış
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Backend image — iki tag: latest + commit SHA (rollback için)
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./it-service-backend
          file: ./it-service-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/it-service-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/it-service-backend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # LLM Service image — iki tag: latest + commit SHA
      - name: Build & push llm-service image
        uses: docker/build-push-action@v5
        with:
          context: ./llm-service
          file: ./llm-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/llm-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/llm-service:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image — iki tag: latest + commit SHA
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./it-service-frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/it-service-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/it-service-frontend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # OpenLDAP image — Dockerfile-ldap repo kokunden ldap-init/ klasorunu icine kopyaliyor
      - name: Build & push openldap-server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile-ldap
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openldap-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/openldap-server:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keycloak image — Dockerfile-keycloak: base imaja it-service-desk temasini gomer
      - name: Build & push keycloak-iam image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile-keycloak
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/keycloak-iam:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/keycloak-iam:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # KIE Server image — Dockerfile-kie: ticket-workflow kjar'i KIE'nin Maven repo'suna gomer
      - name: Build & push kie-server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile-kie
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kie-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kie-server:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 2. VDS'e deploy (Docker Compose)
  #    Güçlü bir VDS temin edildiğinde aşağıdaki job'ın
  #    başındaki `if: false` satırı kaldırılır ve
  #    gerekli secrets (VDS_HOST, VDS_USER, VDS_SSH_KEY)
  #    GitHub repo → Settings → Secrets altına eklenir.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VDS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: false   # ← VDS hazır olduğunda bu satırı sil

    # GitHub Environment: Settings → Environments → production
    # altında manuel onay kapısı eklenebilir.
    environment: production

    steps:
      - name: Checkout (docker-compose.yaml için)
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "docker-compose.yaml"
          target: "/opt/ticketsystem"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            cd /opt/ticketsystem

            # Yeni image tag'ini ortam değişkeni olarak set et
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}

            # Yeni image'ları çek
            docker compose pull it-service-backend it-service-frontend llm-service

            # Sırayla yeniden başlat — diğer servisler (DB, Keycloak vb.) etkilenmez
            docker compose up -d --no-deps it-service-backend
            sleep 15
            docker compose up -d --no-deps llm-service
            sleep 10
            docker compose up -d --no-deps it-service-frontend

            # Kullanılmayan eski image'ları temizle
            docker image prune -f

  # ─────────────────────────────────────────────────────────────
  # 3. K8s cluster'a deploy (kustomize prod overlay)
  #    K8s prod cluster'ı hazır olduğunda:
  #      - `if: false` kaldırılır
  #      - secrets (KUBE_CONFIG_BASE64) eklenir — kubeconfig base64 encoded
  #      - DOCKERHUB_USERNAME secret'ı zaten mevcut
  #    `kustomize edit set image` komutuyla prod overlay'in image referansları
  #    SHA tag'iyle güncellenir → silent downgrade engellenir, rollback için
  #    önceki SHA'ya commit revert yeterli.
  # ─────────────────────────────────────────────────────────────
  deploy-k8s:
    name: Deploy to K8s (prod overlay)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: false   # ← K8s cluster hazır olduğunda bu satırı sil

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl + kustomize
        uses: azure/setup-kubectl@v4
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Override image tags with commit SHA
        run: |
          cd k8s/overlays/prod
          SHA=${{ github.event.workflow_run.head_sha }}
          REG=${{ secrets.DOCKERHUB_USERNAME }}
          kustomize edit set image \
            local/it-service-backend=$REG/it-service-backend:$SHA \
            local/llm-service=$REG/llm-service:$SHA \
            local/it-service-frontend=$REG/it-service-frontend:$SHA \
            local/openldap-server=$REG/openldap-server:$SHA \
            local/keycloak-iam=$REG/keycloak-iam:$SHA \
            local/kie-server=$REG/kie-server:$SHA

      - name: Apply manifests
        run: |
          kustomize build k8s/overlays/prod --load-restrictor=LoadRestrictionsNone | kubectl apply -f -
          kubectl -n ticketsystem rollout status deploy/it-service-backend --timeout=180s
          kubectl -n ticketsystem rollout status deploy/it-service-frontend --timeout=120s
          kubectl -n ticketsystem rollout status deploy/llm-service --timeout=120s
