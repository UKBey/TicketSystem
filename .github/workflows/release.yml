name: Release

# `v*` formatındaki bir tag push'landığında tetiklenir (örn. v1.13.0).
# Tag'in annotated mesajını (tagle'ın yazdığı "Highlights since ...") olduğu gibi
# GitHub Release notu olarak yayınlar. Sadece tag ref'inde çalışır — normal commit/
# branch push'unu etkilemez, bu yüzden CD (cd.yml, main'de Docker imajları) ile çakışmaz.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # release oluşturmak/düzenlemek için gerekli

jobs:
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      # Annotated tag mesajının runner'da mevcut olması için tam geçmiş + tag'ler çekilir.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout, tag push'unda annotated tag'i lightweight tag'e (mesajsız, commit'e
      # işaret eden ref) çevirir; bu yüzden --notes-from-tag commit başlığına düşer. Gerçek
      # annotated tag objesini remote'tan zorla geri çekerek mesajı geri kazanırız.
      - name: Restore annotated tag
        run: git fetch origin --force "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      # Release yoksa oluştur, varsa (tag yeniden konumlandırıldıysa) notlarını güncelle —
      # böylece retag idempotent çalışır, "already exists" hatası vermez.
      - name: Create or update release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME" \
            || gh release edit "$GITHUB_REF_NAME" --verify-tag --notes-from-tag
