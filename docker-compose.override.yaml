# ============================================================================
#  DEV overlay — AUTOMATICALLY merged by `docker compose up` (no -f needed).
# ============================================================================
# `docker-compose.yaml` holds the environment-agnostic base. This file adds back
# everything that belongs to LOCAL DEVELOPMENT only and must NOT exist in a
# production deployment:
#   • host-published ports (DB, Redis, Keycloak-direct, Kafka, OpenSearch, …)
#   • build-from-source (`build:`) instead of pulling pinned images
#   • host ports for the base-defined mailpit (UI 8025 / SMTP 1025) — the service
#     itself + its Gmail relay live in the base file and run in prod too (unexposed)
#   • the dev-only tools: phpldapadmin, OpenSearch Dashboards, SonarQube
#   • dev app settings (Swagger on, Hibernate SQL logging, dev OTEL env)
#
# Because Compose auto-loads `docker-compose.override.yaml`, every existing
# workflow (`make up`, `make infra`, `make logs`, …) keeps working unchanged.
#
# Production instead uses the explicit prod overlay (override is NOT auto-loaded
# when -f is given):
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
# ============================================================================
services:

  # --- host-published ports + build-from-source ----------------------------
  it-service-db:
    # Port sadece gelistirme araclarinin (DBeaver vb.) dogrudan erisimi icin acik.
    ports:
      - "5432:5432"

  openldap-server:
    build:
      context: .
      dockerfile: Dockerfile-ldap

  keycloak-iam:
    # Dev: start-dev — realm import + dinamik hostname (web localhost, mobil LAN IP).
    command: start-dev --import-realm
    # Admin konsolu nginx'ten (localhost/auth/admin) SUNULMAZ — nginx yalniz
    # /auth/realms ve /auth/resources proxy'ler. Dev'de admin'e dogrudan
    # Keycloak portundan girilir: http://localhost:8080/auth/admin/
    ports:
      - "8080:8080"

  redis:
    ports:
      - "6379:6379"

  opensearch:
    ports:
      - "9200:9200"

  otel-collector:
    ports:
      - "4317:4317"
      - "4318:4318"

  it-service-backend:
    build: ./it-service-backend
    environment:
      # Swagger/OpenAPI dev için açık (default kapalı).
      SPRINGDOC_ENABLED: "true"
      # Hibernate SQL log'ları dev'de açık (prod default WARN — bind sızıntısı engellenir).
      HIBERNATE_SHOW_SQL: "true"
      HIBERNATE_FORMAT_SQL: "true"
      HIBERNATE_SQL_LOG_LEVEL: "DEBUG"
      HIBERNATE_BIND_LOG_LEVEL: "TRACE"
      # MAIL_HOST/PORT (mailpit:1025) ve mailpit depends_on artik base'de — backend
      # her ortamda Mailpit'e gonderir. Giden/yakalanan mailler: http://localhost:8025
      OTEL_RESOURCE_ATTRIBUTES: "service.name=it-service-backend,service.version=0.0.1,deployment.environment=development"

  llm-service:
    build: ./llm-service
    environment:
      OTEL_RESOURCE_ATTRIBUTES: "service.name=llm-service,service.version=0.0.1,deployment.environment=development"

  it-service-frontend:
    build: ./it-service-frontend

  nginx-proxy:
    ports:
      - "80:80"

  kafka:
    ports:
      - "9092:9092"

  kie-server:
    build:
      context: .
      dockerfile: Dockerfile-kie
    ports:
      - "8180:8080"

  data-generator:
    build:
      context: ./data-generator

  # --- dev-only tools (absent in production) -------------------------------

  # LDAP yonetim arayuzu.
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    ports:
      - "8085:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap-server"
      PHPLDAPADMIN_HTTPS: "false"
    depends_on:
      - openldap-server
    networks:
      - it-service-net

  # Mailpit servis tanimi + relay base'de; dev burada yalnizca host portlarini acar.
  # SMTP: localhost:1025  ·  Web UI (yakalanan + relay'lenen mailler): http://localhost:8025
  mailpit:
    ports:
      - "1025:1025"
      - "8025:8025"

  # OpenSearch verisini gorsellestirme arayuzu.
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.6.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - it-service-net
    healthcheck:
      # 15E1 = port 5601 hex
      test: ["CMD-SHELL", "grep -q '00000000:15E1' /proc/net/tcp || grep -q '00000000:15E1' /proc/net/tcp6"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # OpenSearch Dashboards saved-object'larini (3 index pattern + 9 gorsel + 1 pano)
  # ilk ayaga kalkista otomatik import eder. Dashboards "healthy" olunca calisir,
  # API'nin gercekten hazir olmasini /api/status ile bekler, ndjson'u POST eder ve
  # cikar (one-shot). overwrite=true ile idempotenttir: her `make up`'ta tekrar
  # calisip objeleri tazeleyebilir. Manuel re-import icin bkz. RUNBOOK.md.
  opensearch-dashboards-import:
    image: curlimages/curl:8.11.1
    container_name: opensearch-dashboards-import
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
    volumes:
      - ./observability/opensearch-dashboards.ndjson:/import/dashboards.ndjson:ro
    networks:
      - it-service-net
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "[import] OpenSearch Dashboards API hazir olana kadar bekleniyor..."
        until curl -sf http://opensearch-dashboards:5601/api/status >/dev/null 2>&1; do
          sleep 3
        done
        echo "[import] API hazir, saved object'lar import ediliyor..."
        curl -sf -X POST 'http://opensearch-dashboards:5601/api/saved_objects/_import?overwrite=true' \
          -H 'osd-xsrf: true' \
          -F file=@/import/dashboards.ndjson
        echo ""
        echo "[import] Tamamlandi."

  # Kod kalitesi analiz veritabani.
  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonarqube}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - it-service-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonarqube}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kod kalitesi ve guvenlik analiz platformu.
  # Arayuz: http://localhost:9000  (admin / admin — ilk giriste degistir)
  sonarqube:
    image: sonarqube:25.4.0.105899-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      sonarqube-db:
        condition: service_healthy
    networks:
      - it-service-net
    # SonarQube, vm.max_map_count >= 524288 gerektirir.
    # Linux host'ta: sudo sysctl -w vm.max_map_count=524288
    # Docker Desktop (Windows/Mac) bu ayari otomatik yapar.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
