<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Boyamadan once kayitli tema/dili uygula — yanlis tema flash'ini onler.
         ThemeContext init mantigini birebir yansitir:
         localStorage 'theme' -> 'theme' cookie -> prefers-color-scheme.
         'theme' cookie'si ve 'language' anahtari Keycloak giris temasiyla paylasilir. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'dark' && t !== 'light') {
            var m = document.cookie.match(/(?:^|;\s*)theme=(light|dark)(?:;|$)/);
            t = m ? m[1] : null;
          }
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var el = document.documentElement;
          el.classList.remove('light', 'dark');
          el.classList.add(t);
          var lang = localStorage.getItem('language');
          if (lang === 'tr' || lang === 'en') el.setAttribute('lang', lang);
        } catch (e) { /* localStorage/cookie erisilemezse sessizce devam et */ }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IT Service Desk - Ticket Management System" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>IT Service Desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
