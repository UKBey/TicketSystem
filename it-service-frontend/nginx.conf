server {
    listen       80;
    server_name  localhost;

    # OIDC kesif dokumanlari icin .well-known isteklerini Keycloak'a iletir.
    location /.well-known/ {
        proxy_pass http://keycloak-iam:8080/.well-known/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Derlenmis frontend dosyalarini servis eder.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API cagrilarini backend servisine yonlendirir.
    location /api/ {
        proxy_pass http://it-service-backend:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak auth endpoint'lerine gecis saglar.
    location /auth/ {
        proxy_pass http://keycloak-iam:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://keycloak-iam:8080/ http://$host/;
    }

    # Keycloak admin konsolu icin gecis saglar.
    location /admin/ {
        proxy_pass http://keycloak-iam:8080/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://keycloak-iam:8080/ http://$host/;
    }

    # Realm tabanli Keycloak endpoint'lerine gecis saglar.
    location /realms/ {
        proxy_pass http://keycloak-iam:8080/realms/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://keycloak-iam:8080/ http://$host/;
    }
}
