server {
    listen       80;
    server_name  localhost;

    # Proxy /.well-known requests to Keycloak (for OIDC discovery)
    location /.well-known/ {
        proxy_pass http://keycloak-iam:8080/.well-known/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static frontend files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the Spring Boot backend
    location /api/ {
        proxy_pass http://it-service-backend:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /auth requests to Keycloak
    location /auth/ {
        proxy_pass http://keycloak-iam:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://keycloak-iam:8080/ http://$host/;
    }

    # Proxy /realms requests to Keycloak
    location /realms/ {
        proxy_pass http://keycloak-iam:8080/realms/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://keycloak-iam:8080/ http://$host/;
    }
}
