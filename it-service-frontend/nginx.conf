server {
    listen       80;
    server_name  localhost;

    # Gzip sikistirma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    root  /usr/share/nginx/html;
    index index.html index.htm;

    # Auth-kritik dosyalar ASLA cache'lenmemeli. Keycloak silent-SSO iframe'i
    # silent-check-sso.html'i yukler; eski bir kopyasi (ornegin inline-script'li
    # surum) tarayicida cache kalirsa CSP ihlali olusur ve giris akisi kilitlenir.
    # index.html de no-store: yeni deploy sonrasi kullanici eski bundle referansli
    # HTML almasin (hash'li /assets/* dosyalari zaten icerikle birlikte degisir).
    location = /silent-check-sso.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /silent-check-sso.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Hash'li build asset'leri (Vite /assets/*.js, *.css) icerige gore isimlendirilir
    # — sonsuza dek guvenle cache'lenebilir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA icin bilinmeyen tum path'leri index.html'e yonlendirir.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
