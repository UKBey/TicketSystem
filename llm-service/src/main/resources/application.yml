server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketdb}
    username: ${SPRING_DATASOURCE_USERNAME:ticketadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:5s}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    # llm-service kendi migration geçmişini ayrı tabloda tutar.
    # Böylece it-service-backend'in flyway_schema_history tablosuyla çakışmaz.
    table: flyway_schema_history_llm
    # public schema it-service-backend tarafından zaten dolu olduğu için
    # baseline ile başlatılması gerekiyor.
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Groq API ayarları
groq:
  api:
    url: https://api.groq.com/openai/v1/chat/completions
    key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.1-8b-instant}
    # Maksimum token sayısı (özet için yeterli)
    max-tokens: ${GROQ_MAX_TOKENS:1024}
    # Saniye cinsinden istek zaman aşımı
    timeout-seconds: ${GROQ_TIMEOUT_SECONDS:30}

# it-service-backend bağlantısı (ticket verisi çekmek için)
ticket-service:
  base-url: ${TICKET_SERVICE_BASE_URL:http://it-service-backend:8081}
  # Backend'in internal endpoint'leri için shared secret
  internal-token: ${TICKET_SERVICE_INTERNAL_TOKEN:internal-secret}

# Per-client (IP bazli) rate limit — Redis'te Bucket4j ProxyManager ile yonetilir.
# Varsayilan: 10 saniyede 1 istek. Tum degerler env vars uzerinden override edilebilir.
app:
  rate-limit:
    enabled: ${LLM_RATE_LIMIT_ENABLED:true}
    max-requests: ${LLM_RATE_LIMIT_MAX_REQUESTS:1}
    duration-seconds: ${LLM_RATE_LIMIT_DURATION_SECONDS:10}
    # Sadece pahalı Groq cağrisini yapan "generate" endpoint'i throttle edilir.
    # Latest/list GET'leri DB'den okur — rate-limit'e tabi degildir.
    path-patterns: ${LLM_RATE_LIMIT_PATH_PATTERNS:/api/ai/summaries/tickets/*/generate}
