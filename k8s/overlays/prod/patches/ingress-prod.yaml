# Host degisikligi (ticketsystem.local -> example.com) kustomization.yaml'daki
# JSON6902 patch ile yapilir — strategic merge ile `rules:` listesine dokunmak
# base'deki TUM path tanimlarini siliyordu (Ingress rules'ta merge key yok,
# liste komple replace edilir). Burada yalniz annotation + tls eklenir.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketsystem
  annotations:
    # cert-manager issues Let's Encrypt certs via the cluster issuer named below;
    # set this up once per cluster (see k8s/README.md "Production").
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: TS_AFFINITY
    nginx.ingress.kubernetes.io/session-cookie-path: /api/v1/ws
spec:
  tls:
    - hosts:
        - ticketsystem.example.com
      secretName: ticketsystem-tls
