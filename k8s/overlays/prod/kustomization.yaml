apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticketsystem

resources:
  - ../../base
  - hpa-backend.yaml
  # OpenSearch'u AG katmaninda izole et (guvenlik plugin'i base'de kapali) —
  # yalniz observability client'lari :9200'e erisebilir.
  - patches/networkpolicy-opensearch.yaml

# Production secrets are committed as SealedSecret manifests sealed against the
# cluster's bitnami-labs/sealed-secrets controller. The unsealed Secret keeps
# the canonical name `app-secrets` so manifests in base/ resolve unchanged.
#
# To bootstrap:
#   kubeseal --controller-namespace kube-system --controller-name sealed-secrets-controller \
#     -f /tmp/app-secrets-plain.yaml -o yaml > k8s/overlays/prod/app-secrets.sealed.yaml
#
# Add the sealed file to resources: above once it exists.

patches:
  - path: patches/replicas.yaml
  - path: patches/ingress-prod.yaml
  - path: patches/configmap-app-prod.yaml
  # Keycloak'i prod modunda calistir (start-dev YERINE start --import-realm)
  - path: patches/keycloak-prod.yaml
  # Ingress host'unu sadece tek alanda degistirmek icin JSON6902 patch
  # (local overlay'deki ile ayni teknik). Strategic merge ile rules listesine
  # dokunulsa base'deki path tanimlari komple kaybolur.
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: ticketsystem
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ticketsystem.example.com
      # Dev/observability yuzeyleri prod'da ingress'ten KALDIRILIR — Swagger,
      # OpenAPI spec, Mailpit ve OpenSearch Dashboards public host'tan auth'suz
      # erisilebilir olmasin (base'de dev icin tanimli). Index'ler yuksekten
      # alcaga silinir; aksi halde her remove sonraki index'leri kaydirir.
      # Base path sirasi: 0 /api/v1/ai · 1 /api/v1 · 2 /auth/realms ·
      # 3 /auth/resources · 4 /swagger-ui · 5 /v3/api-docs · 6 /mailpit ·
      # 7 /opensearch · 8 /
      - op: remove
        path: /spec/rules/0/http/paths/7
      - op: remove
        path: /spec/rules/0/http/paths/6
      - op: remove
        path: /spec/rules/0/http/paths/5
      - op: remove
        path: /spec/rules/0/http/paths/4
  # WebSocket ingress ayni host'u kullanmali — TLS sertifikasi ana ingress'in
  # tls bloğundan gelir, ayrica tanimlamaya gerek yok.
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: ticketsystem-websocket
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ticketsystem.example.com

# Image tag stratejisi — silent downgrade'i (`:latest` + `IfNotPresent`) önlemek
# için CD pipeline'ı her deploy'da `kustomize edit set image` ile newTag'i git
# commit SHA'sı ile günceller. Immutable tag → `IfNotPresent` güvenli kalır
# (aynı tag asla iki kez push edilmez), tarayıcı eski layer'a düşmez.
#
# CD adımı (cd.yml içinde):
#   cd k8s/overlays/prod
#   kustomize edit set image \
#     local/it-service-backend=${REGISTRY}/it-service-backend:${SHA} \
#     local/llm-service=${REGISTRY}/llm-service:${SHA} \
#     local/it-service-frontend=${REGISTRY}/it-service-frontend:${SHA} \
#     local/openldap-server=${REGISTRY}/openldap-server:${SHA}
images:
  - name: local/it-service-backend
    newName: local/it-service-backend
    newTag: latest
  - name: local/llm-service
    newName: local/llm-service
    newTag: latest
  - name: local/it-service-frontend
    newName: local/it-service-frontend
    newTag: latest
  - name: local/openldap-server
    newName: local/openldap-server
    newTag: latest
