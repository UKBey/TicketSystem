# Base configmap'i `http://ticketsystem.local` URL'lerini kullaniyor; lokal
# kind setup'inda http://localhost'tan eristigimiz icin (secure context) bu
# alanlari override ediyoruz. Keycloak realm export'u zaten localhost'a gore
# client redirect URI tanimli (keycloak-init/realm-export.json).
#
# OPS-8: 4 URL ayni hostname kullanir — base'deki yorumla ayni kural:
# Hostname'i degistirirken 4 satiri (FRONTEND_URL, HOSTNAME_URL, ADMIN_URL,
# JWT_ISSUER_URI) birlikte guncelle. JWK_SET_URI overlay'lerde override edilmez
# cunku in-cluster service hostname'i (keycloak-iam:8080) degismez.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  KEYCLOAK_FRONTEND_URL: "http://localhost/auth"
  KC_HOSTNAME_URL: "http://localhost/auth"
  KC_HOSTNAME_ADMIN_URL: "http://localhost/auth"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost/auth/realms/TicketSystemRealm"
  MAIL_FROM: "noreply@localhost"
  # Lokal test/seed icin rate limit pratikte kapali — data-generator yuksek hizla
  # yuzlerce istek atiyor, base'deki 100/60 prod degeri 429 doneriyordu. `.env`
  # uretim degeriyle ayni: 10M/1s + LLM 3/10s.
  RATE_LIMIT_GLOBAL_MAX_REQUESTS: "10000000"
  RATE_LIMIT_GLOBAL_DURATION_SECONDS: "1"
  LLM_RATE_LIMIT_MAX_REQUESTS: "3"
  # Lokal dev'de Swagger UI açık olsun; prod overlay'de default (kapalı) kalır.
  SPRINGDOC_ENABLED: "true"
