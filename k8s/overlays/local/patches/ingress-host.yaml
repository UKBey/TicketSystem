# Local kind cluster ingress annotation override. Lokal'de HTTPS yok, ssl-redirect
# kapatilmali. Host degisikligi (ticketsystem.local -> localhost) ayni klasordeki
# kustomization.yaml icindeki JSON6902 patch ile yapiliyor; rules listesini
# strategic merge ile dokunmuyoruz ki base'deki path tanimlarini koruyalim.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketsystem
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
