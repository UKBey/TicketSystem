apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticketsystem

resources:
  - ../../base

# Generate `app-secrets` from the local env file (gitignored).
# Copy `secrets.env.example` to `secrets.env` and fill in dev values.
secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env
    behavior: create

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: patches/frontend-replicas.yaml
  - path: patches/ingress-host.yaml
  - path: patches/configmap-app-local.yaml
  - path: patches/storage-classes.yaml
  # Ingress host'unu sadece tek alanda degistirmek icin JSON6902 patch.
  # Strategic merge ile rules listesine dokunsak base'deki path tanimlari kayboluyor.
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: ticketsystem
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: localhost
  # WebSocket ingress için aynı host override + ssl-redirect kapatma.
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: ticketsystem-websocket
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: localhost
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "false"
  # Local'de Grafana root URL'inin localhost'a göre olması gerekli;
  # base'deki ticketsystem.local kalırsa redirect URL'leri yanlış olur.
  # env array index sırası: 0 ADMIN_USER, 1 ADMIN_PASSWORD, 2 ROOT_URL, 3 SERVE_FROM_SUB_PATH.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: grafana
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "http://localhost/grafana/"
