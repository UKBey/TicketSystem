apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - openldap-service.yaml
  - openldap-statefulset.yaml
  - keycloak-service.yaml
  - keycloak-statefulset.yaml

# ConfigMaps generated from the canonical files in the repo root so the
# Keycloak realm and LDAP seed stay in lockstep with the docker-compose stack.
# `kubectl kustomize` must be invoked with `--load-restrictor=LoadRestrictionsNone`
# (the Makefile target handles this); the same applies to overlays that include
# this directory transitively.
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-export.json=../../../keycloak-init/realm-export.json
  - name: openldap-seed
    files:
      - bootstrap.ldif.template=../../../ldap-init/bootstrap.ldif.template
      - 10-render-bootstrap.sh=../../../ldap-init/10-render-bootstrap.sh

generatorOptions:
  disableNameSuffixHash: true
