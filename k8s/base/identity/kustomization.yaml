apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - openldap-service.yaml
  - openldap-statefulset.yaml
  - keycloak-service.yaml
  - keycloak-statefulset.yaml

# Realm export configmap. Keycloak StatefulSet mount eder ve --import-realm
# args ile ilk acilista realm'i import eder.
# `kubectl kustomize` `--load-restrictor=LoadRestrictionsNone` ile cagrilmali
# (Makefile target hallediyor; transitive include eden overlay'ler de ayni).
#
# Not: LDAP seed `local/openldap-server` image'inin icine `Dockerfile-ldap`
# ile gomulu (entrypoint-wrapper.sh + bootstrap.ldif.template). Ek configmap
# gerekmez.
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-export.json=../../../keycloak-init/realm-export.json

generatorOptions:
  disableNameSuffixHash: true
