apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-iam
  labels:
    app.kubernetes.io/name: keycloak-iam
    app.kubernetes.io/component: identity
spec:
  serviceName: keycloak-iam
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-iam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-iam
        app.kubernetes.io/component: identity
    spec:
      containers:
        - name: keycloak
          # Custom image — base Keycloak image'a `it-service-desk` login temasi
          # gomulu (Dockerfile-keycloak). Compose'da bind mount edilen tema
          # k8s'te image'in icinde gelir.
          image: local/keycloak-iam:latest
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KC_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KC_DB
            - name: KC_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KC_DB_URL
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: KEYCLOAK_DB_USERNAME
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: KEYCLOAK_DB_PASSWORD
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HOSTNAME_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KC_HOSTNAME_URL
            - name: KC_HOSTNAME_ADMIN_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KC_HOSTNAME_ADMIN_URL
            - name: KC_HTTP_RELATIVE_PATH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KC_HTTP_RELATIVE_PATH
            - name: KC_PROXY_HEADERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KC_PROXY_HEADERS
            # realm-export.json icindeki ${...} placeholder'lari import sirasinda
            # bu env var'lardan cozulur: LDAP bind credential + ticket-client
            # service-account secret'i. Boylece Keycloak admin UI'da elle ayar gerekmez.
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: LDAP_ADMIN_PASSWORD
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1536Mi
              cpu: 1000m
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            httpGet:
              path: /auth/realms/master
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /auth/realms/master
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
