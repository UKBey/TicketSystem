apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            # Sub-path serving — ingress'te /grafana prefix'iyle expose edilir.
            # Grafana, redirect ve asset URL'lerini ROOT_URL üzerinden üretir.
            - name: GF_SERVER_ROOT_URL
              value: "http://ticketsystem.local/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        # Provisioning dosyaları repo'daki grafana/provisioning altından
        # configMapGenerator üzerinden mount edilir (base/support/kustomization.yaml).
        # provider.yml ve ticket-system.json aynı dizinde olmalı çünkü provider'ın
        # options.path tanımı /etc/grafana/provisioning/dashboards'a işaret ediyor.
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning-datasources
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning-dashboards
