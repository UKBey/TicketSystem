apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - redis-service.yaml
  - redis-statefulset.yaml
  - mailpit-service.yaml
  - mailpit-deployment.yaml
  - kafka-service.yaml
  - kafka-statefulset.yaml
  - opensearch-service.yaml
  - opensearch-statefulset.yaml
  - opensearch-dashboards-deployment.yaml
  - otel-collector-deployment.yaml
  - logstash-deployment.yaml
  - prometheus-service.yaml
  - prometheus-deployment.yaml
  - grafana-service.yaml
  - grafana-deployment.yaml

configMapGenerator:
  - name: otel-collector-config
    files:
      - otel-collector-config.yaml=../../../otel-collector-config.yaml
  - name: logstash-pipeline
    files:
      - logstash.conf=../../../logstash.conf
  - name: prometheus-config
    files:
      - prometheus.yml=../../../prometheus.yml
  # OPS-5: Alert kurallari — prometheus.yml `rule_files` glob'u ile yukler.
  - name: prometheus-rules
    files:
      - ticketsystem-application.yaml=../../../prometheus-rules.yaml
  - name: grafana-provisioning-datasources
    files:
      - prometheus.yml=../../../grafana/provisioning/datasources/prometheus.yml
  - name: grafana-provisioning-dashboards
    files:
      - provider.yml=../../../grafana/provisioning/dashboards/provider.yml
      - ticket-system.json=../../../grafana/provisioning/dashboards/ticket-system.json

generatorOptions:
  disableNameSuffixHash: true
