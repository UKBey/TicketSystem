apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            # OPS-5: alert rule dosyalari ayri ConfigMap (prometheus-rules) ile mount edilir;
            # prometheus.yml'daki `rule_files: /etc/prometheus/rules/*.yaml` glob'u ile yuklenir.
            - name: rules
              mountPath: /etc/prometheus/rules
      volumes:
        # prometheus.yml configMapGenerator üzerinden repo kökündeki dosyadan üretilir
        # (base/support/kustomization.yaml içinde tanımlı).
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
