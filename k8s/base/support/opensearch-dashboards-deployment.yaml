apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  labels:
    app.kubernetes.io/name: opensearch-dashboards
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch-dashboards
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch-dashboards
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: opensearch-dashboards
          image: opensearchproject/opensearch-dashboards:2.18.0
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: OPENSEARCH_HOSTS
              value: '["http://opensearch:9200"]'
            - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
              value: "true"
            # Ingress'ten /opensearch prefix'i ile servis edilebilmesi için sub-path desteği.
            # Dashboards tüm asset URL'lerini bu prefix ile üretir; ingress rewrite gerekmez.
            - name: SERVER_BASEPATH
              value: "/opensearch"
            - name: SERVER_REWRITEBASEPATH
              value: "true"
