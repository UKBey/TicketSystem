apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketsystem
  labels:
    app.kubernetes.io/name: ticketsystem-ingress
    app.kubernetes.io/component: ingress
  annotations:
    # Buffer/timeout knobs lifted from nginx/nginx.conf so WebSocket upgrades
    # (STOMP under /api/ws/**) survive the longer Spring Boot handshakes.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: ticketsystem.local
      http:
        paths:
          # /api/ai/* longest-prefix önce — yoksa generic /api kuralı yakalar.
          - path: /api/ai
            pathType: Prefix
            backend:
              service:
                name: llm-service
                port:
                  number: 8082
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: it-service-backend
                port:
                  number: 8081
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak-iam
                port:
                  number: 8080
          # Swagger UI ve OpenAPI spec — dev/local'de SPRINGDOC_ENABLED=true
          # iken erişilir; prod'da backend zaten endpoint'i register etmez (404).
          # Doğru path: /swagger-ui/index.html (springdoc default). Kısa yol
          # /swagger-ui (slash yok) için compose'da nginx redirect var; K8s'te
          # kullanıcının tam path'i yazması gerek veya yer ingress annotation
          # ile redirect eklenebilir (ihtiyaca göre).
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: it-service-backend
                port:
                  number: 8081
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: it-service-backend
                port:
                  number: 8081
          # Observability ve developer UI'ları — her servis kendi base-path
          # config'iyle çalışıyor, ingress'in rewrite yapmasına gerek yok:
          #  - Mailpit: MP_WEBROOT=mailpit
          #  - Grafana: GF_SERVER_SERVE_FROM_SUB_PATH=true + GF_SERVER_ROOT_URL
          #  - OpenSearch Dashboards: SERVER_BASEPATH=/opensearch + REWRITEBASEPATH=true
          - path: /mailpit
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  number: 8025
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /opensearch
            pathType: Prefix
            backend:
              service:
                name: opensearch-dashboards
                port:
                  number: 5601
          - path: /
            pathType: Prefix
            backend:
              service:
                name: it-service-frontend
                port:
                  number: 80
