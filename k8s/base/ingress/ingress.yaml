apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketsystem
  labels:
    app.kubernetes.io/name: ticketsystem-ingress
    app.kubernetes.io/component: ingress
  annotations:
    # Buffer/timeout knobs lifted from nginx/nginx.conf so WebSocket upgrades
    # (STOMP under /api/v1/ws/**) survive the longer Spring Boot handshakes.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: ticketsystem.local
      http:
        paths:
          # /api/v1/ai/* longest-prefix önce — yoksa generic /api/v1 kuralı yakalar.
          - path: /api/v1/ai
            pathType: Prefix
            backend:
              service:
                name: llm-service
                port:
                  number: 8082
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: it-service-backend
                port:
                  number: 8081
          # Keycloak — YALNIZ son-kullanici yuzeyi route edilir (compose'daki
          # nginx/nginx.conf allowlist'inin birebir karsiligi):
          #   /auth/realms    -> OIDC + login-actions (login, TOTP, forgot-password), account
          #   /auth/resources -> login/account temasi asset'leri
          # /auth/admin, /auth/welcome ve ciplak /auth KASITLI olarak route edilmez:
          # catch-all `/` ile frontend SPA'ya duser — ziyaretci hata sayfasi degil
          # uygulamanin "boyle bir sayfa yok" akisini gorur, arkada IAM oldugu belli
          # olmaz. Admin konsoluna erisim ingress'ten DEGIL port-forward ile yapilir:
          #   kubectl -n ticketsystem port-forward svc/keycloak-iam 8080:8080
          #   tarayicida: http://localhost:8080/auth/admin/
          # (KC_HOSTNAME_ADMIN_URL bu adrese sabitlenmistir — bkz. configmap-app.yaml)
          - path: /auth/realms
            pathType: Prefix
            backend:
              service:
                name: keycloak-iam
                port:
                  number: 8080
          - path: /auth/resources
            pathType: Prefix
            backend:
              service:
                name: keycloak-iam
                port:
                  number: 8080
          # Swagger UI ve OpenAPI spec — dev/local'de SPRINGDOC_ENABLED=true
          # iken erişilir; prod'da backend zaten endpoint'i register etmez (404).
          # Doğru path: /swagger-ui/index.html (springdoc default). Kısa yol
          # /swagger-ui (slash yok) için compose'da nginx redirect var; K8s'te
          # kullanıcının tam path'i yazması gerek veya yer ingress annotation
          # ile redirect eklenebilir (ihtiyaca göre).
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: it-service-backend
                port:
                  number: 8081
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: it-service-backend
                port:
                  number: 8081
          # Observability ve developer UI'ları — her servis kendi base-path
          # config'iyle çalışıyor, ingress'in rewrite yapmasına gerek yok:
          #  - Mailpit: MP_WEBROOT=mailpit
          #  - OpenSearch Dashboards: SERVER_BASEPATH=/opensearch + REWRITEBASEPATH=true
          #    (metrik, trace ve log dashboard'ları burada)
          - path: /mailpit
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  number: 8025
          - path: /opensearch
            pathType: Prefix
            backend:
              service:
                name: opensearch-dashboards
                port:
                  number: 5601
          - path: /
            pathType: Prefix
            backend:
              service:
                name: it-service-frontend
                port:
                  number: 80
