apiVersion: batch/v1
kind: Job
metadata:
  name: kjar-deploy
  labels:
    app.kubernetes.io/name: kjar-deploy
    app.kubernetes.io/component: workflow
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kjar-deploy
    spec:
      restartPolicy: OnFailure
      containers:
        - name: deploy
          image: curlimages/curl:8.10.1
          env:
            - name: KIE_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JBPM_KIE_SERVER_USERNAME
            - name: KIE_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JBPM_KIE_SERVER_PASSWORD
            - name: KIE_CONTAINER_ID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JBPM_KIE_SERVER_CONTAINER_ID
          command:
            - sh
            - -c
            - |
              set -eu
              echo "[kjar-deploy] Waiting for KIE Server to become ready..."
              until curl -fsSL -u "$KIE_USER:$KIE_PASS" -H 'Accept: application/json' \
                http://kie-server:8080/kie-server/services/rest/server >/dev/null; do
                sleep 5
              done

              echo "[kjar-deploy] Registering container $KIE_CONTAINER_ID (idempotent)"
              # -f KULLANILMIYOR: container zaten kayitliysa KIE 400 + "already exists" doner;
              # bunu basari sayabilmek icin yanit govdesini okumamiz gerekir. Gercek hatalar
              # (cozulemeyen kjar GAV vb.) farkli bir mesaj dondurur ve asagida exit 1 olur.
              resp=$(curl -sS -X PUT -u "$KIE_USER:$KIE_PASS" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json' \
                "http://kie-server:8080/kie-server/services/rest/server/containers/$KIE_CONTAINER_ID" \
                -d '{
                  "container-id": "'"$KIE_CONTAINER_ID"'",
                  "release-id": {
                    "group-id": "com.ticketsystem",
                    "artifact-id": "ticket-workflow-kjar",
                    "version": "1.0.5"
                  }
                }')
              echo "$resp"
              case "$resp" in
                *'"type" : "SUCCESS"'*|*'already exists'*)
                  echo "[kjar-deploy] Done." ;;
                *)
                  echo "[kjar-deploy] Registration FAILED." >&2
                  exit 1 ;;
              esac
