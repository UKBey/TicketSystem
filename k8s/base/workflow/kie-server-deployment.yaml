apiVersion: apps/v1
kind: Deployment
metadata:
  name: kie-server
  labels:
    app.kubernetes.io/name: kie-server
    app.kubernetes.io/component: workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kie-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kie-server
        app.kubernetes.io/component: workflow
    spec:
      containers:
        - name: kie-server
          # Custom image — base showcase image'a ticket-workflow kjar'i gomulu
          # (Dockerfile-kie). Compose'da host'tan bind mount edilen ~/.m2 burada
          # gerekmez; kjar-deploy job'u artifact'i lokal repo'dan cozer.
          image: local/kie-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KIE_SERVER_ID
              value: ticket-kie-server
            - name: KIE_SERVER_LOCATION
              value: http://kie-server:8080/kie-server/services/rest/server
            # SLA breach callback'i icin paylasilan internal token. BPMN script task'i
            # System.getenv ile okur ve X-Internal-Token header'i olarak gonderir — secret
            # callbackUrl process degiskeninde tasinmaz (jbpm-db/log sizintisi engellenir).
            - name: JBPM_KIE_SERVER_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JBPM_KIE_SERVER_CALLBACK_TOKEN
            - name: JAVA_OPTS
              value: >-
                -Xms512m -Xmx1024m
                -Djava.net.preferIPv4Stack=true
                -Dorg.kie.server.id=ticket-kie-server
                -Dorg.kie.server.location=http://kie-server:8080/kie-server/services/rest/server
                -Dorg.kie.server.persistence.ds=java:jboss/datasources/ExampleDS
                -Dorg.kie.server.persistence.dialect=org.hibernate.dialect.H2Dialect
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1536Mi
              cpu: 1000m
          # KIE Server'in /kie-server/services/rest/server endpoint'i Basic Auth
          # ister; httpGet probe credential gondermedigi icin 401 doner ve probe
          # surekli fail eder. TCP probe ile port acik olunca Ready isaretliyoruz.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
