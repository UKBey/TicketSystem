apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-service-backend
  labels:
    app.kubernetes.io/name: it-service-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: it-service-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: it-service-backend
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: local/it-service-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: it-service-backend
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
