apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticketsystem

commonLabels:
  app.kubernetes.io/part-of: ticketsystem

resources:
  - namespace.yaml
  - configmap-app.yaml
  - data/it-service-db-initdb-configmap.yaml
  - data/it-service-db-service.yaml
  - data/it-service-db-statefulset.yaml
  - data/jbpm-db-service.yaml
  - data/jbpm-db-statefulset.yaml
  - identity
  - workflow
  - support
  - apps
  - frontend

# Note: `app-secrets` Secret is materialised by overlays via `secretGenerator`
# pointing at `k8s/overlays/<env>/secrets.env` (see k8s/base/secrets.example.env
# for the expected key list). Manifests in this base reference it by name
# (`secretKeyRef: name: app-secrets`).
