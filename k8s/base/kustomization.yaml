apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticketsystem

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: ticketsystem

resources:
  - namespace.yaml
  - configmap-app.yaml
  - data/it-service-db-initdb-configmap.yaml
  - data/it-service-db-service.yaml
  - data/it-service-db-statefulset.yaml
  - identity
  - workflow
  - support
  - apps
  - frontend
  - ingress

# Note: `app-secrets` Secret is materialised by overlays via `secretGenerator`
# pointing at `k8s/overlays/<env>/secrets.env` (the canonical key list lives in
# k8s/overlays/local/secrets.env.example). Manifests in this base reference it
# by name (`secretKeyRef: name: app-secrets`).
