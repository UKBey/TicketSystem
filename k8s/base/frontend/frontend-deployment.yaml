apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-service-frontend
  labels:
    app.kubernetes.io/name: it-service-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: it-service-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: it-service-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: local/it-service-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
