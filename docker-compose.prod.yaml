# ============================================================================
#  PRODUCTION overlay — applied EXPLICITLY on top of the base file:
#     docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
# ============================================================================
# The dev overlay (docker-compose.override.yaml) is NOT auto-loaded when -f is
# given, so this run gets the base + these production settings only:
#   • pinned images, pulled — no build-from-source (set DOCKERHUB_USERNAME / IMAGE_TAG)
#   • NO host-published internal ports — only nginx is exposed (80 + 443/TLS)
#   • NO dev tools (phpldapadmin, OpenSearch Dashboards, SonarQube). Mailpit DOES
#     run (mail relay/smart-host, defined in the base file) but its ports are NOT
#     published — inspect captured/relayed mail via port-forward only.
#   • Keycloak in production mode; mail delivered through the Mailpit relay; restart
#     policies for resilience
#
# Operator must provide via the prod `.env` (and a TLS-enabled nginx.conf):
#   KC_HOSTNAME_URL, MAIL_RELAY_* (real SMTP for the Mailpit relay), strong secrets,
#   and TLS certs.
# Production-grade autoscaling/secrets/cert-manager live in the k8s prod overlay
# (k8s/overlays/prod) — this file is for a single-host compose deployment.
# ============================================================================
services:

  it-service-db:
    restart: unless-stopped

  openldap-server:
    restart: unless-stopped

  keycloak-iam:
    restart: unless-stopped
    # Production mode (not start-dev). Stok imajla `start` her acilista KC_DB'ye gore
    # otomatik build eder (--optimized onceden `kc.sh build` gomulu imaj ister, stok imajda
    # yok). TLS nginx'te terminate edilir; Keycloak HTTP dinler, public URL'i
    # KC_HOSTNAME_URL'den uretir ve forwarded header'lara guvenir.
    command: start --import-realm
    environment:
      KC_HOSTNAME_URL: ${KC_HOSTNAME_URL:-${KEYCLOAK_FRONTEND_URL:-}}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    # Admin konsolu nginx'ten sunulmaz (nginx yalniz /auth/realms ve /auth/resources
    # proxy'ler; /auth/admin SPA'ya duser). Operator admin'e YALNIZCA SSH tuneli ile
    # erisir — port host'un loopback'ine bagli, disaridan erisilemez:
    #   ssh -L 8080:127.0.0.1:8080 <prod-host>
    #   tarayicida: http://localhost:8080/auth/admin/
    # KC_HOSTNAME_STRICT=false oldugu icin admin konsolu istek host'undan cozulur;
    # tunel uzerinden redirect sorunu yasanirsa KC_HOSTNAME_ADMIN: http://localhost:8080
    # ekleyin.
    ports:
      - "127.0.0.1:8080:8080"

  redis:
    restart: unless-stopped

  opensearch:
    restart: unless-stopped

  otel-collector:
    restart: unless-stopped

  data-prepper:
    restart: unless-stopped

  it-service-backend:
    restart: unless-stopped
    # Mail: backend base'de Mailpit'e gonderir; gercek gonderim Mailpit relay'i
    # (MP_SMTP_RELAY_*, .env'deki MAIL_RELAY_*) ile yapilir — direkt SMTP yok.

  # Mailpit prod'da da calisir (relay/smart-host) ama UI/SMTP portlari YAYINLANMAZ —
  # yalnizca port-forward ile goruntulenir:
  #   ssh -L 8025:127.0.0.1:8025 <prod-host>   (once host'ta: docker compose port mailpit 8025
  #   ile container portunu host loopback'ine baglayin ya da gecici `ports` ekleyin)
  # veya tek seferlik:  docker compose exec mailpit wget -qO- localhost:8025 ...
  mailpit:
    restart: unless-stopped

  llm-service:
    restart: unless-stopped

  it-service-frontend:
    restart: unless-stopped

  nginx-proxy:
    restart: unless-stopped
    # Tek dis erisim noktasi. 443 icin nginx.conf'a TLS server block'u + sertifika
    # mount'u eklenmelidir (asagidaki volume yorumunu acin).
    ports:
      - "80:80"
      - "443:443"
    # volumes:
    #   - ./nginx/certs:/etc/nginx/certs:ro

  kafka:
    restart: unless-stopped

  logstash:
    restart: unless-stopped

  kie-server:
    restart: unless-stopped
