networks:
  it-service-net:
    driver: bridge

volumes:
  postgres_data:
  ldap_data:
  ldap_config:
  opensearch_data:
    # OpenSearch verilerinin kalıcı olması için eklendi

services:
  # 1. PostgreSQL Veritabanı
  it-service-db:
    image: postgres:15-alpine
    container_name: it-service-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ticketadmin
      POSTGRES_PASSWORD: 321654
      POSTGRES_DB: ticketdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - it-service-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ticketadmin -d ticketdb" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. OpenLDAP Sunucusu (Kullanıcı Dizinimiz)
  openldap-server:
    build:
      context: .
      dockerfile: Dockerfile-ldap
    container_name: openldap-server
    ports:
      - "389:389"
    environment:
      LDAP_ORGANISATION: "Ticket System"
      LDAP_DOMAIN: "ticketsystem.com"
      LDAP_ADMIN_PASSWORD: "321654"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - it-service-net

  # 3. phpLDAPadmin
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    ports:
      - "8085:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap-server"
      PHPLDAPADMIN_HTTPS: "false"
    depends_on:
      - openldap-server
    networks:
      - it-service-net

  # 4. Keycloak Sunucusu
  keycloak-iam:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak-iam
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://it-service-db:5432/keycloakdb
      KC_DB_USERNAME: ticketadmin
      KC_DB_PASSWORD: 321654
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: 321654
    volumes:
      - ./keycloak-init:/opt/keycloak/data/import
    depends_on:
      it-service-db:
        condition: service_healthy
    networks:
      - it-service-net

  # ---------------- YENİ EKLENEN OBSERVABILITY KATMANI ----------------

  # 5. OpenSearch (Veri Deposu)
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - it-service-net

  # 6. OpenSearch Dashboards (Arayüz)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
    networks:
      - it-service-net

  # 7. OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - opensearch
    networks:
      - it-service-net

  # -------------------------------------------------------------------

  # 8. Spring Boot Backend Servisi
  it-service-backend:
    build:
      context: ./it-service-backend
      dockerfile: Dockerfile
    container_name: it-service-backend
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://it-service-db:5432/ticketdb
      SPRING_DATASOURCE_USERNAME: ticketadmin
      SPRING_DATASOURCE_PASSWORD: 321654
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/TicketSystemRealm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak-iam:8080/realms/TicketSystemRealm/protocol/openid-connect/certs

      # OTel Ortam Değişkenleri Eklendi:
      OTEL_SERVICE_NAME: "it-service-backend"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_TRACES_EXPORTER: "otlp"
    depends_on:
      it-service-db:
        condition: service_healthy
      keycloak-iam:
        condition: service_started
      otel-collector:
        # Backend başlamadan Collector hazır olsun
        condition: service_started
    networks:
      - it-service-net

  # 9. React/Vite Frontend Servisi
  it-service-frontend:
    build:
      context: ./it-service-frontend
      dockerfile: Dockerfile
    container_name: it-service-frontend
    ports:
      - "3000:80"
    depends_on:
      - it-service-backend
    networks:
      - it-service-net
  # 10. KAFKA (Log Tamponu / Apache Resmi İmajı) 
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: "TicketSystemKafkaCluster"
    networks:
      - it-service-net
  # 11. LOGSTASH (Log Tüketici Servisi) 
  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:latest
    container_name: logstash-consumer
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - kafka
      - opensearch
    networks:
      - it-service-net
