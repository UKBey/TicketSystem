networks:
  it-service-net:
    driver: bridge

volumes:
  postgres_data:
  ldap_data:
  ldap_config:
  opensearch_data:
    # OpenSearch verilerinin kalıcı olması için eklendi
  jbpm_postgres_data:
    # jBPM KIE Server veritabanı verilerinin kalıcı olması için eklendi

services:
  # 1. PostgreSQL Veritabanı
  it-service-db:
    image: postgres:15-alpine
    container_name: it-service-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - it-service-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. OpenLDAP Sunucusu (Kullanıcı Dizinimiz)
  openldap-server:
    build:
      context: .
      dockerfile: Dockerfile-ldap
    container_name: openldap-server
    ports:
      - "389:389"
    environment:
      LDAP_ORGANISATION: "${LDAP_ORGANISATION}"
      LDAP_DOMAIN: "${LDAP_DOMAIN}"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      LDAP_CUSTOMER_PASSWORD: "${LDAP_CUSTOMER_PASSWORD}"
      LDAP_AGENT_PASSWORD: "${LDAP_AGENT_PASSWORD}"
      LDAP_MANAGER_PASSWORD: "${LDAP_MANAGER_PASSWORD}"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - it-service-net

  # 3. phpLDAPadmin
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    ports:
      - "8085:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap-server"
      PHPLDAPADMIN_HTTPS: "false"
    depends_on:
      - openldap-server
    networks:
      - it-service-net

  # 4. Keycloak Sunucusu
  keycloak-iam:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak-iam
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://it-service-db:5432/keycloakdb
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak-init:/opt/keycloak/data/import
    depends_on:
      it-service-db:
        condition: service_healthy
    networks:
      - it-service-net

  # ---------------- YENİ EKLENEN OBSERVABILITY KATMANI ----------------

  # 5. OpenSearch (Veri Deposu)
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - it-service-net

  # 6. OpenSearch Dashboards (Arayüz)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
    networks:
      - it-service-net

  # 7. OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - opensearch
    networks:
      - it-service-net

  # -------------------------------------------------------------------

  # 8. Spring Boot Backend Servisi
  it-service-backend:
    build:
      context: ./it-service-backend
      dockerfile: Dockerfile
    container_name: it-service-backend
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}

      # jBPM / KIE Server Ayarları
      JBPM_KIE_SERVER_URL: ${JBPM_KIE_SERVER_URL}
      JBPM_KIE_SERVER_USERNAME: ${JBPM_KIE_SERVER_USERNAME}
      JBPM_KIE_SERVER_PASSWORD: ${JBPM_KIE_SERVER_PASSWORD}
      JBPM_KIE_SERVER_CONTAINER_ID: ${JBPM_KIE_SERVER_CONTAINER_ID}
      JBPM_KIE_SERVER_PROCESS_ID: ${JBPM_KIE_SERVER_PROCESS_ID}
      JBPM_KIE_SERVER_TIMEOUT: "${JBPM_KIE_SERVER_TIMEOUT}"
      JBPM_KIE_SERVER_CALLBACK_TOKEN: "${JBPM_KIE_SERVER_CALLBACK_TOKEN}"
      JBPM_KIE_SERVER_CALLBACK_BASE_URL: "${JBPM_KIE_SERVER_CALLBACK_BASE_URL}"

      # OTel Ortam Değişkenleri Eklendi:
      OTEL_SERVICE_NAME: "it-service-backend"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_TRACES_EXPORTER: "otlp"
    depends_on:
      it-service-db:
        condition: service_healthy
      keycloak-iam:
        condition: service_started
      kie-server:
        condition: service_started
      otel-collector:
        # Backend başlamadan Collector hazır olsun
        condition: service_started
    networks:
      - it-service-net
    extra_hosts:
      - "localhost:host-gateway"


  # 9. React/Vite Frontend Servisi
  it-service-frontend:
    build:
      context: ./it-service-frontend
      dockerfile: Dockerfile
    container_name: it-service-frontend
    ports:
      - "3000:80"
    depends_on:
      - it-service-backend
    networks:
      - it-service-net
  # 10. KAFKA (Log Tamponu / Apache Resmi İmajı) 
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: "TicketSystemKafkaCluster"
    networks:
      - it-service-net
  # 11. LOGSTASH (Log Tüketici Servisi) 
  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:latest
    container_name: logstash-consumer
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - kafka
      - opensearch
    networks:
      - it-service-net

  # --------------- jBPM / KIE SERVER KATMANI ---------------

  # 12. jBPM Veritabanı (KIE Server süreç kalıcılığı için)
  jbpm-db:
    image: postgres:15-alpine
    container_name: jbpm-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${JBPM_DB_USER}
      POSTGRES_PASSWORD: ${JBPM_DB_PASSWORD}
      POSTGRES_DB: ${JBPM_DB_NAME}
    volumes:
      - jbpm_postgres_data:/var/lib/postgresql/data
    networks:
      - it-service-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JBPM_DB_USER} -d ${JBPM_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 13. Standalone jBPM KIE Server (Unmanaged Mode)
  #     Varsayılan kullanıcı: kieserver / kieserver1!
  #     Swagger UI: http://localhost:8180/kie-server/docs
  kie-server:
    image: jboss/kie-server-showcase:latest
    container_name: kie-server
    ports:
      - "8180:8080"
    environment:
      KIE_SERVER_ID: "ticket-kie-server"
      KIE_SERVER_LOCATION: "http://kie-server:8080/kie-server/services/rest/server"
      # Unmanaged mod: Controller (Business Central) tanımlanmıyor
      # H2 in-memory kullanılır (dev). Production'da PostgreSQL'e geçiş için:
      #   -Dorg.kie.server.persistence.ds=java:jboss/datasources/jbpmDS
      #   -Dorg.kie.server.persistence.dialect=org.hibernate.dialect.PostgreSQLDialect
      JAVA_OPTS: >-
        -Xms512m -Xmx1024m
        -Djava.net.preferIPv4Stack=true
        -Dorg.kie.server.id=ticket-kie-server
        -Dorg.kie.server.location=http://kie-server:8080/kie-server/services/rest/server
        -Dorg.kie.server.persistence.ds=java:jboss/datasources/ExampleDS
        -Dorg.kie.server.persistence.dialect=org.hibernate.dialect.H2Dialect
    depends_on:
      jbpm-db:
        condition: service_healthy
    networks:
      - it-service-net
    volumes:
      - ~/.m2/repository:/opt/jboss/.m2/repository
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # ---------------------------------------------------------
