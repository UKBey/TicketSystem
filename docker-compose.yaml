networks:
  it-service-net:
    driver: bridge

volumes:
  postgres_data:
  ldap_data:
  ldap_config:
  opensearch_data:
    # OpenSearch indekslerinin konteyner yeniden baslasa da korunmasini saglar.
  jbpm_postgres_data:
    # jBPM surec verilerinin kalici depoda tutulmasini saglar.
  sonarqube_data:
    # SonarQube analiz verileri.
  sonarqube_extensions:
    # SonarQube eklentileri.
  sonarqube_logs:
    # SonarQube log dosyalari.
  sonarqube_db_data:
    # SonarQube veritabani verileri.
  redis_data:
    # Rate-limit bucket'lari ve gelecekte eklenecek cache/queue verisi.

services:
  # Uygulama veritabani servisi.
  it-service-db:
    image: postgres:15-alpine
    container_name: it-service-db
    # Port sadece gelistirme araclarinin (DBeaver vb.) dogrudan erisimi icin acik.
    # Uretimde bu satiri kaldirabilirsiniz.
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - it-service-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kimlik dizini (LDAP) servisi.
  openldap-server:
    build:
      context: .
      dockerfile: Dockerfile-ldap
    image: ${DOCKERHUB_USERNAME:-local}/openldap-server:${IMAGE_TAG:-latest}
    container_name: openldap-server
    # LDAP portu disariya kapali — sadece Docker internal network uzerinden erisim.
    environment:
      LDAP_ORGANISATION: "${LDAP_ORGANISATION}"
      LDAP_DOMAIN: "${LDAP_DOMAIN}"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      LDAP_CUSTOMER_PASSWORD: "${LDAP_CUSTOMER_PASSWORD}"
      LDAP_AGENT_PASSWORD: "${LDAP_AGENT_PASSWORD}"
      LDAP_LEAD_PASSWORD: "${LDAP_LEAD_PASSWORD}"
      LDAP_MANAGER_PASSWORD: "${LDAP_MANAGER_PASSWORD}"
      LDAP_ADMIN_USER_PASSWORD: "${LDAP_ADMIN_USER_PASSWORD}"
      LDAP_ADMINMANAGER_PASSWORD: "${LDAP_ADMINMANAGER_PASSWORD}"
      LDAP_LEADMANAGER_PASSWORD: "${LDAP_LEADMANAGER_PASSWORD}"
      LDAP_SUPERADMIN_PASSWORD: "${LDAP_SUPERADMIN_PASSWORD}"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - it-service-net
    healthcheck:
      # 0185 = port 389 hex (LDAP). Container'da ldapsearch olsa bile root erisimi
      # ve TLS config karmasiklasiyor; basit port aktiflik kontrolu yeterli.
      test: ["CMD-SHELL", "grep -q '00000000:0185' /proc/net/tcp || grep -q '00000000:0185' /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # LDAP yonetim arayuzu.
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    ports:
      - "8085:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap-server"
      PHPLDAPADMIN_HTTPS: "false"
    depends_on:
      - openldap-server
    networks:
      - it-service-net

  # Kimlik ve yetkilendirme sunucusu.
  keycloak-iam:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak-iam
    command: start-dev --import-realm
    healthcheck:
      # 1F90 = port 8080 hex. Keycloak container'inda curl/wget yok; /proc/net/tcp ile check.
      test: ["CMD-SHELL", "grep -q '00000000:1F90' /proc/net/tcp || grep -q '00000000:1F90' /proc/net/tcp6"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    # Keycloak portu disariya kapali — nginx uzerinden /realms/ path'i ile erisim.
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://it-service-db:5432/keycloakdb
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Hostname SABITLENMIYOR — start-dev modunda Keycloak gelen istegin host'una
      # gore URL uretir (KC_PROXY_HEADERS: xforwarded ile nginx forwarded header'larina
      # guvenir). Boylece web localhost'tan, mobil cihaz LAN IP'sinden ayni anda calisir.
      # Keycloak'in tum endpoint'lerini /auth/ prefix'i altinda sunmasi icin.
      KC_HTTP_RELATIVE_PATH: /auth
      # Nginx'in X-Forwarded-* headerlarini Keycloak'in tanimasi icin.
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak-init:/opt/keycloak/data/import
      - ./keycloak-themes/it-service-desk:/opt/keycloak/themes/it-service-desk
    depends_on:
      it-service-db:
        condition: service_healthy
    networks:
      - it-service-net

  # Dagitik rate-limit bucket'lari ve gelecekteki cache/queue ihtiyaclari icin Redis.
  # Lokal gelistirmede 6379 portu host'a aciktir — uretimde kaldirilabilir.
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - it-service-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Gelistirme ortami mail sunucusu (giden mailler http://localhost:8025 adresinden izlenir).
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - it-service-net
    healthcheck:
      # 1F59 = port 8025 hex; wget yerine /proc/net/tcp ile container-agnostic check.
      test: ["CMD-SHELL", "grep -q '00000000:1F59' /proc/net/tcp || grep -q '00000000:1F59' /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Gozlemlenebilirlik katmani servisleri.

  # Log ve telemetry verisi icin arama/veri deposu.
  opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - it-service-net
    healthcheck:
      # 23F0 = port 9200 hex. Cluster health request gerektirmeden basit port aktiflik kontrolu.
      test: ["CMD-SHELL", "grep -q '00000000:23F0' /proc/net/tcp || grep -q '00000000:23F0' /proc/net/tcp6"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # OpenSearch verisini gorsellestirme arayuzu.
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.6.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - it-service-net
    healthcheck:
      # 15E1 = port 5601 hex
      test: ["CMD-SHELL", "grep -q '00000000:15E1' /proc/net/tcp || grep -q '00000000:15E1' /proc/net/tcp6"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Telemetry verisini toplayip hedefe aktaran collector.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.0
    container_name: otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - it-service-net
    # NOT: otel/opentelemetry-collector-contrib distroless image — /bin/sh yok,
    # CMD-SHELL pattern'i tanımıyor. health_check extension de config'de açık değil
    # (port 13133 expose edilmemiş). Backend `service_started` ile yetiniyor:
    # collector ~1-2sn'de up oluyor, OTLP exporter'lar transparent retry.

  # OTel Collector'dan metrikleri OTLP/gRPC ile alip OpenSearch'e yazar.
  # Collector'in opensearch exporter'i metrik desteklemedigi icin metrik yolu
  # buradan gecer; trace ve log dogrudan opensearch exporter ile gider.
  data-prepper:
    image: opensearchproject/data-prepper:2.10.2
    container_name: data-prepper
    volumes:
      - ./data-prepper/pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml:ro
      - ./data-prepper/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - it-service-net

  # Gozlemlenebilirlik katmani sonu.

  # Backend API servisi.
  it-service-backend:
    build: ./it-service-backend
    image: ${DOCKERHUB_USERNAME:-local}/it-service-backend:${IMAGE_TAG:-latest}
    container_name: it-service-backend
    # Backend portu disariya kapali — nginx uzerinden /api/v1/ path'i ile erisim.
    environment:
      SERVER_PORT: "8081"
      # Swagger/OpenAPI dev için açık (default kapalı); compose dev workflow değişmez.
      SPRINGDOC_ENABLED: "true"
      # Hibernate SQL log'ları dev'de açık (prod default WARN — sensitive bind sızıntısı engellenir).
      HIBERNATE_SHOW_SQL: "true"
      HIBERNATE_FORMAT_SQL: "true"
      HIBERNATE_SQL_LOG_LEVEL: "DEBUG"
      HIBERNATE_BIND_LOG_LEVEL: "TRACE"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      # JWT dogrulamasi yalnizca jwk-set-uri (realm imza anahtarlari) ile yapilir.
      # issuer-uri sabitlenmez: Keycloak dinamik hostname'de farkli iss uretir
      # (web localhost, mobil LAN IP) — imza zaten realm'e sabit oldugu icin guvenli.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://keycloak-iam:8080/auth/realms/${KEYCLOAK_REALM:-TicketSystemRealm}/protocol/openid-connect/certs}"

      # Workflow baglanti ayarlari.
      JBPM_KIE_SERVER_URL: ${JBPM_KIE_SERVER_URL}
      JBPM_KIE_SERVER_USERNAME: ${JBPM_KIE_SERVER_USERNAME}
      JBPM_KIE_SERVER_PASSWORD: ${JBPM_KIE_SERVER_PASSWORD}
      JBPM_KIE_SERVER_CONTAINER_ID: ${JBPM_KIE_SERVER_CONTAINER_ID}
      JBPM_KIE_SERVER_PROCESS_ID: ${JBPM_KIE_SERVER_PROCESS_ID}
      JBPM_KIE_SERVER_TIMEOUT: "${JBPM_KIE_SERVER_TIMEOUT}"
      JBPM_KIE_SERVER_CALLBACK_TOKEN: "${JBPM_KIE_SERVER_CALLBACK_TOKEN}"
      JBPM_KIE_SERVER_CALLBACK_BASE_URL: "${JBPM_KIE_SERVER_CALLBACK_BASE_URL}"

      # Mail ayarlari.
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-noreply@ticketsystem.local}

      # OpenTelemetry ayarlari.
      # Not: OTEL_TRACES_EXPORTER ve OTEL_METRICS_EXPORTER kasitli olarak tanimlanmadi.
      # Spring Boot 4 Micrometer bu ikisini management.otlp.* via kendi SDK'siyla yonetiyor.
      # Bu env varlar OTel SDK auto-configuration'i tetikleyerek Micrometer ile cakisiyor
      # ve span'larin yanlis timestamp (JVM nanoTime) ile gonderilmesine yol aciyor.
      OTEL_SERVICE_NAME: "it-service-backend"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_RESOURCE_ATTRIBUTES: "service.name=it-service-backend,service.version=0.0.1,deployment.environment=development"
      # Metrikler OpenSearch'te saklaniyor — delta temporality kumulatif sayac yerine
      # her aralik icin artisi gonderir; Dashboards'ta sum aggregation dogrudan calisir
      # (Prometheus'taki rate() ihtiyacini ortadan kaldirir).
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "delta"
      # Keycloak Admin Client — kullanıcı yönetimi için service account bağlantısı
      KEYCLOAK_ADMIN_SERVER_URL: "http://keycloak-iam:8080/auth"
      KEYCLOAK_ADMIN_REALM: "TicketSystemRealm"
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

      # Rate Limit ayarlari
      RATE_LIMIT_GLOBAL_MAX_REQUESTS: ${RATE_LIMIT_GLOBAL_MAX_REQUESTS:-100}
      RATE_LIMIT_GLOBAL_DURATION_SECONDS: ${RATE_LIMIT_GLOBAL_DURATION_SECONDS:-60}
      RATE_LIMIT_GLOBAL_ENABLED: ${RATE_LIMIT_GLOBAL_ENABLED:-true}

      # Comment ayarlari (B-10) — DB CHECK (V23) 500 max, asagi cekmek guvenli.
      COMMENT_COOLDOWN_SECONDS: ${COMMENT_COOLDOWN_SECONDS:-3}
      COMMENT_MAX_LENGTH: ${COMMENT_MAX_LENGTH:-500}

      # Redis baglanti ayarlari — rate-limit bucket'lari ve gelecekteki cache/queue kullanimi.
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}

      # SLA policy ayarlari
      SLA_LOW_RESOLUTION_HOURS: ${SLA_LOW_RESOLUTION_HOURS:-72}
      SLA_LOW_WARNING_HOURS: ${SLA_LOW_WARNING_HOURS:-2}
      SLA_MEDIUM_RESOLUTION_HOURS: ${SLA_MEDIUM_RESOLUTION_HOURS:-24}
      SLA_MEDIUM_WARNING_HOURS: ${SLA_MEDIUM_WARNING_HOURS:-2}
      SLA_HIGH_RESOLUTION_HOURS: ${SLA_HIGH_RESOLUTION_HOURS:-4}
      SLA_HIGH_WARNING_HOURS: ${SLA_HIGH_WARNING_HOURS:-1}
      SLA_CRITICAL_RESOLUTION_HOURS: ${SLA_CRITICAL_RESOLUTION_HOURS:-1}
      SLA_CRITICAL_WARNING_HOURS: ${SLA_CRITICAL_WARNING_HOURS:-0}

      # "Cok uzun suredir bekleyen" dashboard uyarilari esikleri (saat). Sure, ticketin
      # ilgili duruma girdigi andan itibaren olculur.
      ALERTS_WAITING_FOR_CUSTOMER_MAX_HOURS: ${ALERTS_WAITING_FOR_CUSTOMER_MAX_HOURS:-48}
      ALERTS_RESOLVED_MAX_HOURS: ${ALERTS_RESOLVED_MAX_HOURS:-72}
    depends_on:
      it-service-db:
        condition: service_healthy
      keycloak-iam:
        condition: service_healthy
      kie-server:
        condition: service_healthy
      # kjar-deploy job tamamlandiktan sonra backend baslar: aksi halde ilk
      # createTicket istegi "Container 'ticket-workflow' is not instantiated"
      # hatasi alir cunku KIE Server icinde container henuz kayitli olmaz.
      kjar-deploy:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        # Collector distroless image — healthcheck imkansiz (hicbir shell yok).
        # Backend OTLP exporter zaten transparent retry yapar, baslangic gecikmesi gorunmez.
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - it-service-net
    extra_hosts:
      - "localhost:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # LLM servis katmanı — Groq API üzerinden ticket özetleme.
  llm-service:
    build: ./llm-service
    image: ${DOCKERHUB_USERNAME:-local}/llm-service:${IMAGE_TAG:-latest}
    container_name: llm-service
    # Port dışarıya kapalı — nginx üzerinden /api/v1/ai/ path'i ile erişim.
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-1024}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-30}
      TICKET_SERVICE_BASE_URL: "http://it-service-backend:8081"
      TICKET_SERVICE_INTERNAL_TOKEN: ${TICKET_SERVICE_INTERNAL_TOKEN:-internal-secret}

      # Redis baglanti ayarlari — rate-limit ve gelecekteki cache/queue ihtiyaclari.
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}

      # LLM-service rate-limit (per-IP, configlenebilir; varsayilan: 10 saniyede 1).
      LLM_RATE_LIMIT_ENABLED: ${LLM_RATE_LIMIT_ENABLED:-true}
      LLM_RATE_LIMIT_MAX_REQUESTS: ${LLM_RATE_LIMIT_MAX_REQUESTS:-1}
      LLM_RATE_LIMIT_DURATION_SECONDS: ${LLM_RATE_LIMIT_DURATION_SECONDS:-10}
      LLM_RATE_LIMIT_PATH_PATTERNS: ${LLM_RATE_LIMIT_PATH_PATTERNS:-/api/v1/ai/**}

      # OpenTelemetry — agent trace/metrik/log'lari OTLP ile collector'a gonderir.
      # Metrik delta temporality: OpenSearch sum aggregation'lari rate() olmadan calisir.
      OTEL_SERVICE_NAME: "llm-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_RESOURCE_ATTRIBUTES: "service.name=llm-service,service.version=0.0.1,deployment.environment=development"
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "delta"
    depends_on:
      it-service-db:
        condition: service_healthy
      it-service-backend:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - it-service-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  # Frontend web uygulamasi.
  it-service-frontend:
    build: ./it-service-frontend
    image: ${DOCKERHUB_USERNAME:-local}/it-service-frontend:${IMAGE_TAG:-latest}
    container_name: it-service-frontend
    # Frontend portu disariya kapali — nginx uzerinden / path'i ile erisim.
    depends_on:
      it-service-backend:
        condition: service_started
      keycloak-iam:
        condition: service_started
    networks:
      - it-service-net
    healthcheck:
      # nginx:stable-alpine icinde wget/curl yoktur; /proc/net/tcp ile port kontrolu yapilir.
      # 0050 = port 80 hex karsiligi
      test: ["CMD-SHELL", "grep -q '00000000:0050' /proc/net/tcp || grep -q '00000000:0050' /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Nginx reverse proxy — tek dis erisim noktasi.
  # Tum istekler bu servis uzerinden ilgili servislere yonlendirilir.
  nginx-proxy:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      it-service-frontend:
        condition: service_healthy
      it-service-backend:
        condition: service_started
      keycloak-iam:
        condition: service_started
    networks:
      - it-service-net
    healthcheck:
      # nginx:stable-alpine icinde wget/curl yoktur; /proc/net/tcp ile port kontrolu yapilir.
      # 0050 = port 80 hex karsiligi
      test: ["CMD-SHELL", "grep -q '00000000:0050' /proc/net/tcp || grep -q '00000000:0050' /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Log akisinda tampon gorevi yapan Kafka broker.
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: "TicketSystemKafkaCluster"
    networks:
      - it-service-net
    healthcheck:
      # 2384 = port 9092 hex. Broker burada PLAINTEXT listen ediyor.
      test: ["CMD-SHELL", "grep -q '00000000:2384' /proc/net/tcp || grep -q '00000000:2384' /proc/net/tcp6"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Kafka'dan log okuyup OpenSearch'e yazan Logstash servisi.
  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: logstash-consumer
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - it-service-net
    healthcheck:
      # 2580 = port 9600 hex (Logstash monitoring API).
      test: ["CMD-SHELL", "grep -q '00000000:2580' /proc/net/tcp || grep -q '00000000:2580' /proc/net/tcp6"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # jBPM/KIE Server katmani.

  # KIE Server surec kaliciligi icin ayri veritabani.
  jbpm-db:
    image: postgres:15-alpine
    container_name: jbpm-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${JBPM_DB_USER}
      POSTGRES_PASSWORD: ${JBPM_DB_PASSWORD}
      POSTGRES_DB: ${JBPM_DB_NAME}
    volumes:
      - jbpm_postgres_data:/var/lib/postgresql/data
    networks:
      - it-service-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JBPM_DB_USER} -d ${JBPM_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Standalone KIE Server servisi (unmanaged mod).
  # Custom image (Dockerfile-kie): base showcase image'a ticket-workflow kjar'i
  # Java 8 maven container'inda derlenip gömülü olarak gelir. Boylece host'taki
  # ~/.m2 mount'una bagimli kalmadan, `docker compose up` ilk seferden itibaren
  # kjar'i KIE Server'in local repo'sunda hazir bulur.
  # Varsayilan kullanici: kieserver / kieserver1!
  # Swagger UI: http://localhost:8180/kie-server/docs
  # Versiyon backend'in kullandigi kie-server-client (7.61.0.Final) ile aligne tutuluyor.
  kie-server:
    build:
      context: .
      dockerfile: Dockerfile-kie
    image: ${DOCKERHUB_USERNAME:-local}/kie-server:${IMAGE_TAG:-latest}
    container_name: kie-server
    ports:
      - "8180:8080"
    environment:
      KIE_SERVER_ID: "ticket-kie-server"
      KIE_SERVER_LOCATION: "http://kie-server:8080/kie-server/services/rest/server"
      # jbpmDS datasource (Dockerfile-kie ile gomulu) bu degiskenlerden cozulur.
      # KIE Server surec instance'larini in-memory H2 yerine kalici jbpm-db
      # Postgres'e yazar -> restart/rebuild'de in-flight workflow'lar kaybolmaz.
      JBPM_DB_HOST: "jbpm-db"
      JBPM_DB_PORT: "5432"
      JBPM_DB_NAME: ${JBPM_DB_NAME}
      JBPM_DB_USER: ${JBPM_DB_USER}
      JBPM_DB_PASSWORD: ${JBPM_DB_PASSWORD}
      JAVA_OPTS: >-
        -Xms512m -Xmx1024m
        -Djava.net.preferIPv4Stack=true
        -Dorg.kie.server.id=ticket-kie-server
        -Dorg.kie.server.location=http://kie-server:8080/kie-server/services/rest/server
        -Dorg.kie.server.persistence.ds=java:jboss/datasources/jbpmDS
        -Dorg.kie.server.persistence.dialect=org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      jbpm-db:
        condition: service_healthy
    networks:
      - it-service-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 1F90 = port 8080 hex (Wildfly KIE Server'i burada listen ediyor).
      test: ["CMD-SHELL", "grep -q '00000000:1F90' /proc/net/tcp || grep -q '00000000:1F90' /proc/net/tcp6"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  # Kjar deploy job (compose karsiligi k8s/base/workflow/kjar-deploy-job.yaml).
  # KIE Server REST hazir olunca container 'ticket-workflow'u PUT ile kaydeder.
  # Idempotent: tekrar calistirilirsa ayni container'i overwrite eder.
  # Image'da gomulu olan ticket-workflow-kjar:1.0.5 artifact'i Maven repo'dan cozulur.
  kjar-deploy:
    image: curlimages/curl:8.10.1
    container_name: kjar-deploy
    depends_on:
      kie-server:
        condition: service_healthy
    networks:
      - it-service-net
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        KIE_USER="$${JBPM_KIE_SERVER_USERNAME:-kieserver}"
        KIE_PASS="$${JBPM_KIE_SERVER_PASSWORD:-kieserver1!}"
        KIE_CONTAINER_ID="$${JBPM_KIE_SERVER_CONTAINER_ID:-ticket-workflow}"

        echo "[kjar-deploy] KIE Server REST hazir mi?"
        until curl -fsS -u "$$KIE_USER:$$KIE_PASS" -H 'Accept: application/json' \
          http://kie-server:8080/kie-server/services/rest/server >/dev/null; do
          echo "[kjar-deploy] henuz hazir degil, 5sn sonra tekrar..."
          sleep 5
        done

        echo "[kjar-deploy] Container '$$KIE_CONTAINER_ID' kaydediliyor (idempotent)..."
        # -f YOK: container zaten kayitliysa KIE 400 + "already exists" doner; bunu basari
        # sayabilmek icin govdeyi okuyoruz. Gercek hatalar farkli mesaj dondurur -> exit 1.
        resp=$$(curl -sS -X PUT -u "$$KIE_USER:$$KIE_PASS" \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json' \
          "http://kie-server:8080/kie-server/services/rest/server/containers/$$KIE_CONTAINER_ID" \
          -d '{
            "container-id": "'$$KIE_CONTAINER_ID'",
            "release-id": {
              "group-id": "com.ticketsystem",
              "artifact-id": "ticket-workflow-kjar",
              "version": "1.0.5"
            }
          }')
        echo "$$resp"
        case "$$resp" in
          *'"type" : "SUCCESS"'*|*'already exists'*) echo "[kjar-deploy] Tamam." ;;
          *) echo "[kjar-deploy] Kayit BASARISIZ." >&2; exit 1 ;;
        esac
    environment:
      JBPM_KIE_SERVER_USERNAME: ${JBPM_KIE_SERVER_USERNAME:-kieserver}
      JBPM_KIE_SERVER_PASSWORD: ${JBPM_KIE_SERVER_PASSWORD:-kieserver1!}
      JBPM_KIE_SERVER_CONTAINER_ID: ${JBPM_KIE_SERVER_CONTAINER_ID:-ticket-workflow}
  # jBPM/KIE Server katmani sonu.

  # Kod kalitesi analiz veritabani.
  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonarqube}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - it-service-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonarqube}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kod kalitesi ve guvenlik analiz platformu.
  # Arayuz: http://localhost:9000  (admin / admin — ilk giriste degistir)
  sonarqube:
    image: sonarqube:25.4.0.105899-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      sonarqube-db:
        condition: service_healthy
    networks:
      - it-service-net
    # SonarQube, vm.max_map_count >= 524288 gerektirir.
    # Linux host'ta: sudo sysctl -w vm.max_map_count=524288
    # Docker Desktop (Windows/Mac) bu ayari otomatik yapar.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Demo veri uretici (data-generator) — SADECE `make gen` ile calisir.
  # profiles: ["tools"] sayesinde `docker compose up` / `make up` ile AYAGA KALKMAZ;
  # yalnizca `docker compose run --no-deps data-generator` (make gen) ile baslar.
  # ZATEN AYAKTA olan stack'e baglanir, stack'i YONETMEZ (deps yeniden tetiklenmez --
  # boylece kjar-deploy gibi tek-seferlik job'lar bozulmaz); isini bitirip cikar.
  data-generator:
    build:
      context: ./data-generator
    image: ${DOCKERHUB_USERNAME:-local}/data-generator:${IMAGE_TAG:-latest}
    container_name: data-generator
    profiles: ["tools"]
    environment:
      # Container compose agindan servislere isimle erisir (localhost yerine).
      GEN_BASE_URL: "http://nginx-proxy"
      GEN_DB_URL: "jdbc:postgresql://it-service-db:5432/ticketdb"
      # DB kimlik bilgileri .env'den (backend ile ayni kaynak); bos ise users.json'a duser.
      GEN_DB_USER: ${SPRING_DATASOURCE_USERNAME:-ticketadmin}
      GEN_DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      # Yorum dalgalarinin temposu backend cooldown'i ile ayni .env degerinden surulur.
      COMMENT_COOLDOWN_SECONDS: ${COMMENT_COOLDOWN_SECONDS:-3}
    volumes:
      # Kimlik bilgileri + seed kullanici listeleri (gitignored, ZORUNLU).
      # DIKKAT: dosya yoksa Docker bunu bos bir DIZIN olarak mount eder ve job
      # "en az bir agent/customer gerekli" hatasiyla coker. `make gen` bu yuzden
      # compose'u cagirmadan once dosyanin varligini kontrol eder. Yoksa once:
      #   cp data-generator/users.example.json data-generator/users.json
      - ./data-generator/users.json:/app/users.json:ro
    # depends_on YOK: bilerek. `make gen` --no-deps ile zaten ayakta olan stack'e
    # baglanir; deps eklenirse `docker compose run` tum zinciri (kjar-deploy dahil)
    # yeniden degerlendirir ve tek-seferlik job'lar exit 22 ile patlar.
    networks:
      - it-service-net
    restart: "no"

  # LDAP'tan federe edilen seed kullanicilara Keycloak realm rollerini atayan
  # tek-seferlik job. `make seed-roles` ile calistirilir (data-generator gibi
  # "tools" profilinde; ana stack ile birlikte AYAGA KALKMAZ). Script Keycloak
  # hazir olana kadar bekler; idempotenttir (tekrar calistirmaya guvenli).
  keycloak-seeder:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak-seeder
    profiles: ["tools"]
    environment:
      KC_URL: "http://keycloak-iam:8080/auth"
      KC_REALM: "${KEYCLOAK_REALM:-TicketSystemRealm}"
      KC_ADMIN: ${KEYCLOAK_ADMIN}
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    entrypoint: ["bash", "/seed/seed-roles.sh"]
    volumes:
      - ./keycloak-init/seed-roles.sh:/seed/seed-roles.sh:ro
    # depends_on YOK (data-generator ile ayni gerekce): --no-deps ile ayakta olan
    # stack'e baglanir; script Keycloak'in hazir olmasini kendi icinde bekler.
    networks:
      - it-service-net
    restart: "no"
