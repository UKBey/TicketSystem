# =============================================================================
# Test Profili Yapilandirmasi (application-test.yml)
# =============================================================================
# Bu dosya, entegrasyon testleri sirasinda uygulama baglam ayarlarini
# uretim ortamindan izole eder. Testcontainers @DynamicPropertySource
# ile datasource bilgileri calisma zamaninda override edilir.
# =============================================================================

spring:
  test:
    database:
      replace: none
  docker:
    compose:
      enabled: false  # Docker Compose otomatik baslatma devre disi birakilir.
  data:
    redis:
      # BaseIntegrationTest icindeki Testcontainer host/port'u
      # @DynamicPropertySource ile override eder.
      host: localhost
      port: 6379
      timeout: 5s
  jpa:
    hibernate:
      ddl-auto: validate  # Sema yonetimi Flyway'e birakilir; JPA sadece dogrular.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Test ortaminda gercek Keycloak sunucusu bulunmadigi icin
          # issuer-uri dogrulamasi devre disi birakilir.
          issuer-uri: https://localhost/mock-issuer
          jwk-set-uri: https://localhost/mock-jwk

# jBPM KIE Server: Test ortaminda gercek baglanti yapilmaz.
# @MockBean ile KieServerAdapter stub edilir; buradaki degerler
# yalnizca @Value enjeksiyonunun NullPointerException firlatmasini onler.
jbpm:
  kie-server:
    url: http://localhost:0/mock-kie
    username: testuser
    password: testpass
    container-id: test-container
    process-id: test-process
    timeout: 5000
    callback-token: test-callback-token-for-IT
    callback-base-url: http://localhost:0/mock-callback

logging:
  level:
    org.testcontainers: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
