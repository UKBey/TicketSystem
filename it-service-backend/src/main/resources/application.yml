server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketdb}
    username: ${SPRING_DATASOURCE_USERNAME:ticketadmin}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.orm.jdbc.bind: TRACE
  messages:
    encoding: UTF-8
    use-code-as-default-message: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
  docker:
    compose:
      enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080/realms/TicketSystemRealm}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/TicketSystemRealm/protocol/openid-connect/certs}

app:
  mail:
    from: ${MAIL_FROM:noreply@ticketsystem.local}
  sla:
    policies:
      LOW:
        resolution-hours: ${SLA_LOW_RESOLUTION_HOURS:72}
        warning-threshold-hours: ${SLA_LOW_WARNING_HOURS:2}
      MEDIUM:
        resolution-hours: ${SLA_MEDIUM_RESOLUTION_HOURS:24}
        warning-threshold-hours: ${SLA_MEDIUM_WARNING_HOURS:2}
      HIGH:
        resolution-hours: ${SLA_HIGH_RESOLUTION_HOURS:4}
        warning-threshold-hours: ${SLA_HIGH_WARNING_HOURS:1}
      CRITICAL:
        resolution-hours: ${SLA_CRITICAL_RESOLUTION_HOURS:1}
        warning-threshold-hours: ${SLA_CRITICAL_WARNING_HOURS:0}

# ============================================================
# Gözlemlenebilirlik (Observability) — OpenTelemetry
# ============================================================
management:
  # Actuator endpoint'lerini aç
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

  # Micrometer Tracing: her isteği örnekle (geliştirme ortamı için 1.0)
  tracing:
    sampling:
      probability: 1.0

  # Micrometer OTLP metrics exporter
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

# ============================================================
# Keycloak Admin Client — kullanıcı yönetimi (service account)
# ============================================================
keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost/auth}
    realm: ${KEYCLOAK_ADMIN_REALM:TicketSystemRealm}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:ticket-client}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# jBPM KIE Server baglanti ve callback ayarlari.
jbpm:
  kie-server:
    url: ${JBPM_KIE_SERVER_URL:http://localhost:8180/kie-server/services/rest/server}
    username: ${JBPM_KIE_SERVER_USERNAME:kieserver}
    password: ${JBPM_KIE_SERVER_PASSWORD}
    container-id: ${JBPM_KIE_SERVER_CONTAINER_ID:ticket-workflow}
    process-id: ${JBPM_KIE_SERVER_PROCESS_ID:com.ticketsystem.workflow.ticket-lifecycle}
    timeout: ${JBPM_KIE_SERVER_TIMEOUT:30000}
    callback-token: ${JBPM_KIE_SERVER_CALLBACK_TOKEN}
    callback-base-url: ${JBPM_KIE_SERVER_CALLBACK_BASE_URL:http://host.docker.internal:8081/api/internal/workflow/callback}