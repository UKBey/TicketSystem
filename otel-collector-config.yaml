receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024


exporters:
  opensearch:
    http:
      endpoint: "http://opensearch:9200"
      tls:
        insecure: true
    logs_index: otel-logs
    # NOT: `traces_index` opensearch exporter'dan opentelemetry-collector-contrib
    # 0.114.0 itibariyle kaldirildi; traces default index'e (ss4o_traces-default-
    # namespace) yazilir. Eski compose `:latest` cache'i kabul ediyordu, yeni
    # versiyonlar parse hatasi veriyor.

  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: false
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [opensearch]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [opensearch]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]