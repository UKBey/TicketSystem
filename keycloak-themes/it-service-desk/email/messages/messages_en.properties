# IT Service Desk — password reset email (EN). Keycloak reads theme message
# bundles as UTF-8 and merges them over the parent (keycloak) theme, so only the
# keys used by our custom template plus the overridden subject live here.
itPwResetLang=en
passwordResetSubject=Reset your IT Service Desk password
itPwResetTitle=Password Reset Request
itPwResetGreeting=Hello {0},
itPwResetIntro=We received a request to reset your password.
itPwResetValidity=The link below is valid for {0} and can be used only once. Your current password keeps working until you complete the reset.
itPwResetCta=Reset password
itPwResetFallback=If the button doesn''t work, copy this link into your browser:
itPwResetIgnore=If you didn''t request a password reset, you can safely ignore this email — your password will not change.
itPwResetFooter=IT Service Desk · This is an automated message, please do not reply.
