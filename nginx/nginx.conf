upstream keycloak {
    server keycloak-iam:8080;
}

upstream backend {
    server it-service-backend:8081;
}

upstream llm {
    server llm-service:8082;
}

upstream frontend {
    server it-service-frontend:80;
}

server {
    listen       80;
    server_name  localhost;

    # Gzip sikistirma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Dosya yukleme limiti (AttachmentController icin)
    client_max_body_size 20m;

    # ----------------------------------------------------------------
    # Keycloak — /auth/ altindaki tum istekler
    # KC_HTTP_RELATIVE_PATH=/auth sayesinde Keycloak tum endpoint'lerini
    # /auth/realms/, /auth/admin/, /auth/resources/ altinda sunar.
    # ----------------------------------------------------------------
    location /auth/ {
        proxy_pass http://keycloak/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://keycloak-iam:8080/ http://$host/;
        proxy_cookie_path / /;
        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;
    }

    # ----------------------------------------------------------------
    # Backend API — /api/
    # ----------------------------------------------------------------
    location /api/ai/ {
        proxy_pass http://llm/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;
        # LLM yanıtları uzun sürebilir
        proxy_read_timeout       120s;
    }

    # ----------------------------------------------------------------
    # WebSocket — STOMP gercek zamanli ticket guncellemeleri icin
    # /api/ blokundan once gelmeli (longest-prefix match).
    # ----------------------------------------------------------------
    location /api/ws {
        proxy_pass http://backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout                 3600s;
        proxy_send_timeout                 3600s;
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;
    }

    # ----------------------------------------------------------------
    # Frontend — diger tum istekler React SPA'ya gider
    # ----------------------------------------------------------------
    location / {
        proxy_pass http://frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
