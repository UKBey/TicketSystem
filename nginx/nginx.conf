# Docker'in icsel DNS sunucusu — upstream container isimlerini runtime'da resolve eder.
# Bu sayede compose yeniden olustuktugunda container IP'leri degisse bile nginx
# tahmini upstream cache yerine taze adresi alir; rebuild sonrasi 502 olmaz.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen       80;
    server_name  localhost;

    # Gzip sikistirma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Dosya yukleme limiti (AttachmentController icin)
    client_max_body_size 20m;

    # ----------------------------------------------------------------
    # S-11 — Security header'lari (her yanitla, error responses dahil)
    #
    # `always` flag'i 4xx/5xx response'larda da gondermeyi garanti eder.
    # Tum header'lar bu server-level'da tanimli; alt-location'larda add_header
    # yeniden tanimlanmazsa nginx bunlari inherit eder.
    # ----------------------------------------------------------------
    # Tarayicinin response'u declared MIME type'i disinda yorumlamasini engeller.
    add_header X-Content-Type-Options "nosniff" always;
    # Clickjacking — CSP frame-ancestors'in eski-browser muadili. SAMEORIGIN cunku
    # Keycloak silent SSO mekanizmasi kendi origin'imizden iframe icine assets yukluyor.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Referrer leak'ini sinirlandirir: cross-origin'de yalniz origin gonderilir, ayni origin'de full URL.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS — yalniz HTTPS'te anlamli. HTTP'de browser yok sayar; preload icin 2 yil.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Permissions-Policy: kullanmadigimiz tarayici API'lerine erisimi engelle (XSS payload kullanamaz).
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # Content-Security-Policy — uygulamanin gercek ihtiyaclari:
    #   - script-src 'self' : sadece kendi origin'imizden script (Vite build inline script uretmiyor)
    #   - style-src 'self' 'unsafe-inline' fonts.googleapis.com : Tailwind/Recharts/React inline style + Google Fonts CSS
    #   - font-src 'self' data: fonts.gstatic.com : kendi fontlarimiz + Google Fonts woff dosyalari
    #   - connect-src 'self' ws: wss: : STOMP WebSocket (ws://host/api/v1/ws); ayri scheme defensif
    #   - frame-src 'self' : Keycloak silent SSO iframe (silent-check-sso.html)
    #   - frame-ancestors 'self' : ayni origin'den frame'lemeye izin (Keycloak 3p-cookies iframe icin); cross-origin clickjacking hala bloke
    #   - form-action 'self' : form submit yalniz kendi origin
    #   - img-src 'self' data: : favicon ve embed data URI'ler
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # ----------------------------------------------------------------
    # Keycloak — /auth/ altindaki tum istekler
    # KC_HTTP_RELATIVE_PATH=/auth sayesinde Keycloak tum endpoint'lerini
    # /auth/realms/, /auth/admin/, /auth/resources/ altinda sunar.
    # ----------------------------------------------------------------
    location /auth/ {
        # Keycloak'in kendi sayfalari (login, 3p-cookies/step1.html vb.) inline script
        # kullaniyor. Server-level CSP 'script-src self' bunlari bloklar. nginx kurali:
        # bir location'da en az bir add_header varsa server-level add_header'larin HEPSI
        # iptal olur — bu yuzden burada temel guvenlik header'larini tekrar tanimliyoruz
        # ama CSP'yi KASITLI olarak ekemiyoruz; Keycloak kendi CSP'sini gonderiyor.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Degiskenli proxy_pass — nginx her istekte 'resolver' uzerinden taze IP cozer.
        # URI kismi YOK: degisken kullaninca nginx prefix-rewrite yapmaz, bu yuzden
        # tam request URI'yi (orn. /auth/realms/X) oldugu gibi upstream'e iletmeliyiz.
        set $keycloak_upstream "keycloak-iam:8080";
        proxy_pass http://$keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://keycloak-iam:8080/ http://$host/;
        proxy_cookie_path / /;
        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;
    }

    # ----------------------------------------------------------------
    # LLM service — /api/v1/ai/ icin ayri upstream (it-service-backend degil)
    # /api/v1/ blokundan once gelmeli (longest-prefix match).
    # ----------------------------------------------------------------
    location /api/v1/ai/ {
        set $llm_upstream "llm-service:8082";
        proxy_pass http://$llm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;
        # LLM yanıtları uzun sürebilir
        proxy_read_timeout       120s;
    }

    # ----------------------------------------------------------------
    # WebSocket — STOMP gercek zamanli ticket guncellemeleri icin
    # /api/v1/ blokundan once gelmeli (longest-prefix match).
    # ----------------------------------------------------------------
    location /api/v1/ws {
        set $backend_upstream "it-service-backend:8081";
        # Path rewrite: /api/v1/ws(/...) -> /ws(/...) cunku backend STOMP endpoint'i /ws altinda.
        # Degiskenli proxy_pass ile URI yer degistirme calismadigi icin rewrite kullaniyoruz.
        rewrite ^/api/v1/ws(.*)$ /ws$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout                 3600s;
        proxy_send_timeout                 3600s;
    }

    # ----------------------------------------------------------------
    # Backend API — /api/v1/
    # ----------------------------------------------------------------
    location /api/v1/ {
        set $backend_upstream "it-service-backend:8081";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;
    }

    # ----------------------------------------------------------------
    # Swagger UI ve OpenAPI spec — dev/local için açık (SPRINGDOC_ENABLED=true).
    # Prod'da backend springdoc.api-docs.enabled=false ile endpoint'i zaten
    # register etmediği için bu route 404 döner — kasıtlı.
    # /swagger-ui ve /swagger-ui/ — kısa yol; gerçek UI /swagger-ui/index.html'de.
    # ----------------------------------------------------------------
    location = /swagger-ui {
        return 302 /swagger-ui/index.html;
    }
    location = /swagger-ui/ {
        return 302 /swagger-ui/index.html;
    }

    location /swagger-ui {
        set $backend_upstream "it-service-backend:8081";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        set $backend_upstream "it-service-backend:8081";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------
    # Frontend — diger tum istekler React SPA'ya gider
    # ----------------------------------------------------------------
    location / {
        set $frontend_upstream "it-service-frontend:80";
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
